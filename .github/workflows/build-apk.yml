name: Build Android APK

# Builds an offline LIFEpod APK in the cloud with Capacitor.
# Trigger it from the Actions tab ("Run workflow"), or it runs automatically
# when files under lifepod_js/ change on main. The finished APK is attached to
# the run as a downloadable artifact named "lifepod-debug-apk".

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lifepod_js/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifepod_js

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets (www/)
        run: npm run prepare:www

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: npm run icons || echo "icon generation skipped — using default Capacitor icon"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: lifepod_js/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifepod-debug-apk
          path: lifepod_js/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
