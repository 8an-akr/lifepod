<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#151820">
    <meta name="description" content="Offline LIFEpod replacement for The Game of LIFE Twists & Turns.">
    <title>LIFEpod Replacement</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="lifepod.css">
</head>
<body>
    <!-- Inline icon sprite — single-colour symbols that inherit currentColor.
         Referenced via <use href="#ic-…"> from the LCD, ring buttons, cards and finals. -->
    <svg class="icon-sprite" aria-hidden="true" focusable="false" width="0" height="0">
        <symbol id="ic-house" viewBox="0 0 24 24">
            <path d="M12 3 22 12h-3v9h-5v-6h-4v6H5v-9H2z"/>
        </symbol>
        <symbol id="ic-car" viewBox="0 0 24 24">
            <path d="M2 15c0-1.2.7-1.9 1.8-2.1l1.6-3.4C5.7 8.8 6.4 8.4 7.1 8.4h7.8c.8 0 1.5.5 1.8 1.2l1.5 3.3c1.1.2 1.8.9 1.8 2.1V16.5H2z"/>
            <circle cx="7" cy="16.6" r="2.1"/>
            <circle cx="16.6" cy="16.6" r="2.1"/>
        </symbol>
        <symbol id="ic-baby" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 13V5.2A8 8 0 0 1 12 13z" fill="currentColor" stroke="none"/>
            <path d="M2.5 13h12.5"/>
            <path d="M12.5 13 18 6.5"/>
            <circle cx="6" cy="18" r="1.8" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="18" r="1.8" fill="currentColor" stroke="none"/>
            <path d="M5.3 13.4 5.7 16M12.7 13.4 12.3 16"/>
        </symbol>
        <symbol id="ic-rings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9.2" cy="14" r="4.6"/>
            <circle cx="15" cy="14" r="4.6"/>
        </symbol>
        <symbol id="ic-heart" viewBox="0 0 24 24">
            <path d="M12 20s-7-4.7-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.3-7 10-7 10z"/>
        </symbol>
        <symbol id="ic-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="8.5"/>
            <path d="M12 7.5V12l3.2 2"/>
        </symbol>
        <symbol id="ic-cash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2.5" y="6" width="19" height="12" rx="2"/>
            <circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/>
        </symbol>
        <symbol id="ic-lottery" viewBox="0 0 24 24">
            <path d="M12 2.6 14.7 8.9 21.5 9.5 16.4 14 17.9 20.7 12 17.1 6.1 20.7 7.6 14 2.5 9.5 9.3 8.9z"/>
        </symbol>
        <symbol id="ic-chance" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="4" width="16" height="16" rx="3.2"/>
            <circle cx="9" cy="9" r="1.5" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
            <circle cx="15" cy="15" r="1.5" fill="currentColor" stroke="none"/>
        </symbol>
        <symbol id="ic-volume" viewBox="0 0 24 24">
            <path d="M4 9v6h3.5L13 19V5L7.5 9z"/>
            <path d="M16 8.5a5 5 0 0 1 0 7M18.6 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </symbol>
        <symbol id="ic-volume-off" viewBox="0 0 24 24">
            <path d="M4 9v6h3.5L13 19V5L7.5 9z"/>
            <path d="M16.5 9.5 21.5 14.5M21.5 9.5 16.5 14.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </symbol>
        <symbol id="ic-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
            <path d="M7 4h10v4a5 5 0 0 1-10 0z"/>
            <path d="M7 6H4.6a2.4 2.4 0 0 0 2.7 2.8M17 6h2.4a2.4 2.4 0 0 1-2.7 2.8"/>
            <path d="M12 13v3M9.5 20h5M10.5 20l.4-4h2.2l.4 4"/>
        </symbol>
    </svg>

    <div class="app" id="app">
        <header class="topbar">
            <div>
                <p class="eyebrow">Twists &amp; Turns</p>
                <h1>LIFEpod</h1>
            </div>
            <div class="topbar-actions">
                <select id="playerCountSelect" class="player-count-select" aria-label="Players for next game" title="Set number of players, then press Reset">
                    <option value="2">2 Players</option>
                    <option value="3">3 Players</option>
                    <option value="4" selected>4 Players</option>
                </select>
                <button class="danger-button" id="resetButton" type="button">Reset</button>
            </div>
        </header>

        <main>
            <!-- GAME VIEW — always visible -->
            <section class="game-view" id="gameView" aria-label="LIFEpod game controls">
                <div class="status-strip">
                    <div>
                        <span class="status-label">Years left</span>
                        <strong id="yearsLeft">10</strong>
                    </div>
                    <div>
                        <span class="status-label">Active card</span>
                        <strong id="activeCard">—</strong>
                    </div>
                    <div>
                        <span class="status-label">Last spin</span>
                        <strong id="lastSpin">-</strong>
                    </div>
                </div>

                <div class="game-grid">
                    <!-- LEFT: Visa cards -->
                    <aside class="panel player-panel" aria-labelledby="playersTitle">
                        <div class="panel-heading">
                            <h2 id="playersTitle">Visa Cards</h2>
                            <button class="small-button" id="saveButton" type="button">Save</button>
                        </div>
                        <div class="player-list" id="playerList"></div>
                    </aside>

                    <!-- CENTRE: LIFEpod device -->
                    <section class="device-wrap" aria-labelledby="deviceTitle">
                        <h2 class="sr-only" id="deviceTitle">LIFEpod controller</h2>
                        <div class="device" id="device">
                            <div class="function-ring" id="functionRing"></div>
                            <div class="device-core">
                                <!-- Card slot -->
                                <div class="card-slot" id="cardSlot">NO CARD</div>

                                <!-- Screen row: − screen + -->
                                <div class="screen-row">
                                    <button class="pod-button sign side-sign" data-action="sign-negative" type="button" aria-label="Subtract / scroll back">−</button>
                                    <div class="screen" id="screen" role="status" aria-live="polite">
                                        <!-- Banner: mode + current value/input -->
                                        <div class="lcd-banner">
                                            <span class="lcd-mode" id="screenMode">READY</span>
                                            <strong class="lcd-val" id="screenValue"></strong>
                                        </div>
                                        <!-- LCD stat rows (mirror the physical LIFEpod screen) -->
                                        <div class="lcd-stats">
                                            <div class="lcd-row lcd-row-assets">
                                                <span class="lcd-g"><svg class="ic" fill="currentColor" aria-hidden="true"><use href="#ic-house"/></svg></span><span id="lcdHouses" class="lcd-cnt">0</span>
                                                <span class="lcd-g"><svg class="ic" fill="currentColor" aria-hidden="true"><use href="#ic-car"/></svg></span><span id="lcdCars"   class="lcd-cnt">0</span>
                                                <span class="lcd-g"><svg class="ic" fill="currentColor" aria-hidden="true"><use href="#ic-baby"/></svg></span><span id="lcdBabies" class="lcd-cnt">0</span>
                                            </div>
                                            <div class="lcd-row lcd-row-money">
                                                <span class="lcd-g">$</span>
                                                <span id="lcdMoney"   class="lcd-num">0</span>
                                                <span id="lcdMarried" class="lcd-badge" title="Married"><svg class="ic" fill="currentColor" aria-hidden="true"><use href="#ic-rings"/></svg></span>
                                            </div>
                                            <div class="lcd-row lcd-row-life">
                                                <span class="lcd-g"><svg class="ic" fill="currentColor" aria-hidden="true"><use href="#ic-heart"/></svg></span>
                                                <span id="lcdLife"  class="lcd-num">0</span>
                                                <span class="lcd-g lcd-sep"><svg class="ic" fill="currentColor" aria-hidden="true"><use href="#ic-clock"/></svg></span>
                                                <span id="lcdYears" class="lcd-yrs">—</span>
                                            </div>
                                        </div>
                                        <span class="lcd-hint" id="screenHint">Tap a card · YEARS to set length</span>
                                    </div>
                                    <button class="pod-button sign side-sign" data-action="sign-positive" type="button" aria-label="Add / scroll forward">+</button>
                                </div>

                                <!-- Main controls -->
                                <div class="main-controls">
                                    <button class="pod-button enter" data-action="enter" type="button">ENTER</button>
                                    <button class="pod-button spin"  data-action="spin"  type="button">SPIN</button>
                                    <button class="pod-button undo"  data-action="undo"  type="button">UNDO</button>
                                </div>

                                <!-- Mode controls -->
                                <div class="mode-controls">
                                    <button class="pod-button money" data-action="mode-money" type="button">$</button>
                                    <button class="pod-button life"  data-action="mode-life"  type="button">LIFE POINTS</button>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- LEDGER -->
                <section class="panel ledger-panel" aria-labelledby="ledgerTitle">
                    <div class="panel-heading">
                        <h2 id="ledgerTitle">Ledger</h2>
                        <button class="small-button" id="clearLedgerButton" type="button">Clear view</button>
                    </div>
                    <div class="ledger" id="ledger"></div>
                </section>
            </section>
        </main>
    </div>

    <!-- FINAL SCORING DIALOG -->
    <dialog class="modal" id="finalDialog">
        <form method="dialog">
            <div class="panel-heading">
                <h2>Final LIFE Points</h2>
                <button class="icon-button" value="cancel" aria-label="Close final scoring" type="submit">×</button>
            </div>
            <div id="finalResults" class="final-results"></div>
            <menu>
                <button class="ghost-button" value="cancel" type="submit">Close</button>
            </menu>
        </form>
    </dialog>

    <!-- CONFIRM DIALOG -->
    <dialog class="modal confirm-modal" id="confirmDialog">
        <div class="confirm-body">
            <p id="confirmMessage" class="confirm-msg"></p>
            <menu>
                <button class="ghost-button" id="confirmNo" type="button">Cancel</button>
                <button class="danger-button" id="confirmYes" type="button">Confirm</button>
            </menu>
        </div>
    </dialog>

    <script src="lifepod.js"></script>
</body>
</html>
