<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#151820">
    <meta name="description" content="Offline LIFEpod replacement for The Game of LIFE Twists & Turns.">
    <title>LIFEpod Replacement</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="lifepod.css">
</head>
<body>
    <div class="app" id="app">
        <header class="topbar">
            <div>
                <p class="eyebrow">Twists &amp; Turns</p>
                <h1>LIFEpod</h1>
            </div>
            <div class="topbar-actions">
                <select id="playerCountSelect" class="player-count-select" aria-label="Players for next game" title="Set number of players, then press Reset">
                    <option value="2">2 Players</option>
                    <option value="3">3 Players</option>
                    <option value="4" selected>4 Players</option>
                </select>
                <button class="danger-button" id="resetButton" type="button">Reset</button>
            </div>
        </header>

        <main>
            <!-- GAME VIEW — always visible -->
            <section class="game-view" id="gameView" aria-label="LIFEpod game controls">
                <div class="status-strip">
                    <div>
                        <span class="status-label">Years left</span>
                        <strong id="yearsLeft">10</strong>
                    </div>
                    <div>
                        <span class="status-label">Active card</span>
                        <strong id="activeCard">—</strong>
                    </div>
                    <div>
                        <span class="status-label">Last spin</span>
                        <strong id="lastSpin">-</strong>
                    </div>
                </div>

                <div class="game-grid">
                    <!-- LEFT: Visa cards -->
                    <aside class="panel player-panel" aria-labelledby="playersTitle">
                        <div class="panel-heading">
                            <h2 id="playersTitle">Visa Cards</h2>
                            <button class="small-button" id="saveButton" type="button">Save</button>
                        </div>
                        <div class="player-list" id="playerList"></div>
                    </aside>

                    <!-- CENTRE: LIFEpod device -->
                    <section class="device-wrap" aria-labelledby="deviceTitle">
                        <h2 class="sr-only" id="deviceTitle">LIFEpod controller</h2>
                        <div class="device" id="device">
                            <div class="function-ring" id="functionRing"></div>
                            <div class="device-core">
                                <!-- Card slot -->
                                <div class="card-slot" id="cardSlot">NO CARD</div>

                                <!-- Screen row: − screen + -->
                                <div class="screen-row">
                                    <button class="pod-button sign side-sign" data-action="sign-negative" type="button" aria-label="Subtract / scroll back">−</button>
                                    <div class="screen" id="screen" role="status" aria-live="polite">
                                        <!-- Banner: mode + current value/input -->
                                        <div class="lcd-banner">
                                            <span class="lcd-mode" id="screenMode">READY</span>
                                            <strong class="lcd-val" id="screenValue"></strong>
                                        </div>
                                        <!-- LCD stat rows (mirror the physical LIFEpod screen) -->
                                        <div class="lcd-stats">
                                            <div class="lcd-row lcd-row-assets">
                                                <span class="lcd-g">⌂</span><span id="lcdHouses" class="lcd-cnt">0</span>
                                                <span class="lcd-g">▶</span><span id="lcdCars"   class="lcd-cnt">0</span>
                                                <span class="lcd-g">☺</span><span id="lcdBabies" class="lcd-cnt">0</span>
                                            </div>
                                            <div class="lcd-row lcd-row-money">
                                                <span class="lcd-g">$</span>
                                                <span id="lcdMoney"   class="lcd-num">0</span>
                                                <span id="lcdMarried" class="lcd-badge">○</span>
                                            </div>
                                            <div class="lcd-row lcd-row-life">
                                                <span class="lcd-g">♥</span>
                                                <span id="lcdLife"  class="lcd-num">0</span>
                                                <span class="lcd-g lcd-sep">◷</span>
                                                <span id="lcdYears" class="lcd-yrs">—</span>
                                            </div>
                                        </div>
                                        <span class="lcd-hint" id="screenHint">Tap a card · YEARS to set length</span>
                                    </div>
                                    <button class="pod-button sign side-sign" data-action="sign-positive" type="button" aria-label="Add / scroll forward">+</button>
                                </div>

                                <!-- Main controls -->
                                <div class="main-controls">
                                    <button class="pod-button enter" data-action="enter" type="button">ENTER</button>
                                    <button class="pod-button spin"  data-action="spin"  type="button">SPIN</button>
                                    <button class="pod-button undo"  data-action="undo"  type="button">UNDO</button>
                                </div>

                                <!-- Mode controls -->
                                <div class="mode-controls">
                                    <button class="pod-button money" data-action="mode-money" type="button">$</button>
                                    <button class="pod-button life"  data-action="mode-life"  type="button">LIFE POINTS</button>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- LEDGER -->
                <section class="panel ledger-panel" aria-labelledby="ledgerTitle">
                    <div class="panel-heading">
                        <h2 id="ledgerTitle">Ledger</h2>
                        <button class="small-button" id="clearLedgerButton" type="button">Clear view</button>
                    </div>
                    <div class="ledger" id="ledger"></div>
                </section>
            </section>
        </main>
    </div>

    <!-- FINAL SCORING DIALOG -->
    <dialog class="modal" id="finalDialog">
        <form method="dialog">
            <div class="panel-heading">
                <h2>Final LIFE Points</h2>
                <button class="icon-button" value="cancel" aria-label="Close final scoring" type="submit">×</button>
            </div>
            <div id="finalResults" class="final-results"></div>
            <menu>
                <button class="ghost-button" value="cancel" type="submit">Close</button>
            </menu>
        </form>
    </dialog>

    <!-- CONFIRM DIALOG -->
    <dialog class="modal confirm-modal" id="confirmDialog">
        <div class="confirm-body">
            <p id="confirmMessage" class="confirm-msg"></p>
            <menu>
                <button class="ghost-button" id="confirmNo" type="button">Cancel</button>
                <button class="danger-button" id="confirmYes" type="button">Confirm</button>
            </menu>
        </div>
    </dialog>

    <script src="lifepod.js"></script>
</body>
</html>
